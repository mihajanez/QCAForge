name: 'Build and Test QCAForge App'

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-15"
            args: "--target aarch64-apple-darwin"
            artifact_path: |
              target/aarch64-apple-darwin/release/
          - platform: "ubuntu-24.04"
            args: ""
            artifact_path: |
              target/release/
          - platform: "windows-2022"
            args: ""
            artifact_path: |
              target/release/

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-15' && 'aarch64-apple-darwin' || '' }}

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install NPM dependencies
        run: npm ci

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt -- --check

      - name: Run Clippy lints
        run: cargo clippy --release --locked ${{ matrix.args }} -- -D warnings

      - name: Run frontend unit tests
        run: npx vitest run

      - name: Build Backend
        run: |
          cargo build --release --locked ${{ matrix.args }}

      - name: Run Rust unit tests
        run: |
          cargo test --release --locked ${{ matrix.args }}

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: ignore
          retention-days: 5

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.platform }}
          path: |
            test-results/
            coverage/
          if-no-files-found: ignore
          retention-days: 5

      - name: Report build status
        if: failure()
        run: echo "❌ Build failed on ${{ matrix.platform }}"
